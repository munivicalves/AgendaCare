spring.application.name=agendacare

# Carrega as variáveis do arquivo .env
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:agendacare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=8080

# Authentication: no default secret; supply a random Base64 key (>= 32 bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:agendacare}
app.jwt.audience=${JWT_AUDIENCE:agendacare-api}
app.jwt.ttl=${JWT_TTL:15m}

# Prevent validation exception logs from exposing rejected passwords at DEBUG.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
