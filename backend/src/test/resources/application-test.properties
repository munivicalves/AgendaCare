# In-memory database only; automated tests never connect to existing PostgreSQL data.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:agendacare-auth-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.issuer=agendacare-test
app.jwt.audience=agendacare-api-test
app.jwt.ttl=15m
