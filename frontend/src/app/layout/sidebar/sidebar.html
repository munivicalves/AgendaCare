@if (aberto()) {
  <button
    class="menu-backdrop"
    type="button"
    tabindex="-1"
    aria-label="Fechar menu"
    (click)="fechar.emit()"
  ></button>
}
<aside
  #painel
  id="navegacao-principal"
  class="sidebar"
  [class.is-open]="aberto()"
  [class.is-collapsed]="recolhida()"
  [cdkTrapFocus]="aberto()"
  (keydown.escape)="fechar.emit()"
>
  <div class="brand-row">
    <a routerLink="/" (click)="fechar.emit()" class="brand" aria-label="AgendaCare, início">
      <span class="brand-mark" aria-hidden="true"
        ><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg
      ></span>
      <span
        ><span class="brand-name">AgendaCare</span
        ><span class="brand-caption">Gestão de atendimentos</span></span
      >
    </a>
    <button type="button" class="close-menu" (click)="fechar.emit()" aria-label="Fechar menu">
      &#215;
    </button>
  </div>
  <button
    type="button"
    class="collapse-toggle"
    (click)="alternar.emit()"
    aria-controls="links-navegacao"
    [attr.aria-expanded]="!recolhida()"
    [attr.aria-label]="recolhida() ? 'Expandir menu lateral' : 'Recolher menu lateral'"
    [attr.title]="recolhida() ? 'Expandir menu lateral' : 'Recolher menu lateral'"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="3" />
      <path d="M9 4v16" />
      <path class="toggle-chevron" d="m15 9-3 3 3 3" />
    </svg>
    <span>Recolher menu</span>
  </button>
  <p class="nav-caption">PRINCIPAL</p>
  <nav id="links-navegacao" aria-label="Navegação principal">
    <a
      routerLink="/"
      title="Dashboard"
      aria-label="Dashboard"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="fechar.emit()"
      ><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" /></svg
      ><span class="nav-label">Dashboard</span></a
    >
    <a
      routerLink="/agenda"
      title="Agenda"
      aria-label="Agenda"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="fechar.emit()"
      ><svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M7 3v4M17 3v4M3 11h18M7 15h3M14 15h3" /></svg
      ><span class="nav-label">Agenda</span></a
    >
    <a
      routerLink="/pacientes"
      title="Pacientes"
      aria-label="Pacientes"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      (click)="fechar.emit()"
      ><svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5" /></svg
      ><span class="nav-label">Pacientes</span></a
    >
  </nav>
  <div class="sidebar-footer">
    <span class="footer-dot" aria-hidden="true"></span>Mais organização.<br />Mais tempo para
    cuidar.
  </div>
</aside>
