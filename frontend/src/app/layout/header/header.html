<header class="topbar">
  <div class="flex min-w-0 items-center gap-3">
    <button
      #menu
      type="button"
      class="menu-toggle"
      (click)="abrirMenu.emit()"
      aria-label="Abrir menu de navegação"
      aria-controls="navegacao-principal"
      [attr.aria-expanded]="menuAberto()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <div>
      <p class="text-xs text-slate-500">Seu espaço de cuidado</p>
      <p class="font-semibold text-slate-800">AgendaCare</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <div class="hidden text-right sm:block">
      <p class="text-sm font-semibold text-slate-700">Profissional</p>
      <p class="text-xs text-slate-500">Gestão de atendimentos</p>
    </div>
    <span class="profile-avatar" aria-hidden="true">AC</span>
  </div>
</header>
